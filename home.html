<section class="fundoFormularios">

  <div class="fundoFormularios">
    <form action="">
      <div class="camposForm">
        <p class="cadastrase">Cadastre-se Aqui!</p>

        <label>Nome Completo</label>
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome">

        <label>E-mail ou Celular</label>
        <input type="email" name="email" id="email" placeholder="Digite seu e-mail ou celular">

        <label>Senha</label>
        <input type="password" name="senha" id="senha" placeholder="Digite sua senha">

        <label>Data de Nascimento</label>
        <input type="date" name="data" id="data" >

        <button type="submit" class="btnForm">Cadastrar</button>
      </div>
    </form>
  </div>

  <div class="fundoFormularios">
    <form action="">
      <div class="camposFormdois">
        <p class="bemVindo">Bem-Vindo de Volta!</p>

        <label>E-mail ou Nome de Usuário</label>
        <input type="email" name="email" id="usuario" placeholder="Digite seu e-mail ou celular">

        <label>Senha</label>
        <input type="password" name="senha" id="segundasenha" placeholder="Digite sua senha">

        <p class="OU" >OU</p>

        <button type="button" class="btnForm"><img src="img/google.png"> Fazer login com o Google</button>

        <button type="button" class="btnForm"><img src="img/facebook.png">Fazer login com o Facebook</button>

        <button type="submit" class="btnForm">Entrar</button>
      </div>
    </form>
  </div>
</section>
